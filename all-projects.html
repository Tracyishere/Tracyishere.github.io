<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="全部项目档案：大模型与智能体、生成与多模态、科学机器学习、决策控制、统计计量与产业系统。" />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111111'/%3E%3Cpath d='M17 18h30v5H23v8h20v5H23v10h24v5H17z' fill='white'/%3E%3C/svg%3E" />
    <title>All Projects — Applied Intelligence</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./all-projects.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./index.html">Applied Intelligence</a>
      <nav aria-label="主导航">
        <a href="./index.html#projects">Selected</a><a href="./all-projects.html" aria-current="page">All Projects</a><a href="./index.html#capabilities">Capabilities</a><a href="./index.html#about">About</a>
      </nav>
      <span class="edition">Portfolio · 2026</span>
    </header>

    <main class="archive-page">
      <section class="archive-intro" aria-labelledby="archive-title">
        <div>
          <p class="section-no">PROJECT ARCHIVE / MLORDER</p>
          <h1 id="archive-title">全部项目</h1>
        </div>
        <div class="archive-summary">
          <strong id="archive-total">—</strong>
          <span>个项目</span>
          <p>按研究主线整理的完整项目档案，可用上方搜索或分类查看。</p>
        </div>
      </section>

      <section class="archive-controls" aria-label="项目检索与筛选">
        <label class="archive-search">
          <span>搜索项目</span>
          <input id="archive-search" type="search" placeholder="输入模型、方法或应用领域" autocomplete="off" />
        </label>
        <div class="archive-filters" id="archive-filters" role="group" aria-label="按领域筛选">
          <button class="archive-filter active" type="button" data-filter="all">全部</button>
          <button class="archive-filter" type="button" data-filter="llm">大模型与智能体</button>
          <button class="archive-filter" type="button" data-filter="gen">生成与多模态</button>
          <button class="archive-filter" type="button" data-filter="health">医疗健康</button>
          <button class="archive-filter" type="button" data-filter="bio">生物化学</button>
          <button class="archive-filter" type="button" data-filter="climate">气象能源</button>
          <button class="archive-filter" type="button" data-filter="finance">金融商业</button>
          <button class="archive-filter" type="button" data-filter="science">智能系统与工程</button>
          <button class="archive-filter" type="button" data-filter="data">数据分析</button>
        </div>
        <p class="archive-result-count" id="archive-result-count" aria-live="polite">正在载入项目……</p>
      </section>

      <section class="archive-grid" id="archive-grid" aria-label="全部项目描述"></section>
      <p class="archive-empty" id="archive-empty" hidden>没有找到匹配的项目。</p>
    </main>

    <footer><span>Applied Intelligence</span><a href="./index.html">返回精选项目</a></footer>
    <script src="./all-projects.js"></script>
  </body>
</html>
